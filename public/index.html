let T=localStorage.t,U,R=[],passengerTab='book';const $=id=>document.getElementById(id),v=id=>$(id).value;const sanitizeText=(value,max=200)=>String(value==null?'':value).replace(/[\u0000-\u001F\u007F]/g,'').replace(/\s+/g,' ').trim().slice(0,max);const escapeHtml=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sanitizePhone=(value)=>{const raw=String(value==null?'':value).trim();if(!raw||/[A-Za-z@]/.test(raw))return '';const cleaned=raw.replace(/[^\d+]/g,'').replace(/^\+{2,}/,'+');const digits=cleaned.replace(/\+/g,'');if(!/^\+?\d+$/.test(cleaned)||digits.length<9||digits.length>15)return '';return cleaned.startsWith('+')?`+${digits}`:digits;};const sanitizeOTP=(value)=>sanitizeText(String(value||'').replace(/\D/g,''),8);const sanitizePIN=(value)=>sanitizeText(String(value==null?'':value).replace(/[\u0000-\u001F\u007F]/g,'').replace(/\s+/g,'').trim(),64);const sanitizeBody=(value,key='')=>{if(typeof value==='string'){const field=key.toLowerCase();if(field==='contentbase64')return value;if(field.includes('phone')||field.includes('mobile')||field.includes('msisdn'))return sanitizePhone(value);if(field.includes('pin')&&field!=='pin_hash')return sanitizePIN(value);if(field.includes('otp')||field==='code')return sanitizeOTP(value);return sanitizeText(value,200)}if(Array.isArray(value))return value.map(item=>sanitizeBody(item,key));if(value&&typeof value==='object'){const cleaned=Object.create(null);for(const[name,item]of Object.entries(value)){if(['__proto__','prototype','constructor'].includes(name))continue;cleaned[name]=sanitizeBody(item,name)}return cleaned}if(typeof value==='number')return Number.isFinite(value)?value:0;if(typeof value==='boolean'||value===null||value===undefined)return value;return value};

function openAppDialog({title,message,fields,confirmLabel='Continue',danger=false,validate}){const dialog=$('app-dialog');if(dialog.open)return Promise.resolve(null);dialog.replaceChildren();const form=document.createElement('form'),heading=document.createElement('h2'),description=document.createElement('p'),error=document.createElement('div'),fieldNodes=[];form.className='app-dialog-form';form.noValidate=true;heading.className='app-dialog-title';heading.textContent=title;heading.id='app-dialog-title';description.className='app-dialog-description';description.textContent=message;description.id='app-dialog-description';error.className='app-dialog-error';error.setAttribute('role','alert');error.setAttribute('aria-live','assertive');error.hidden=true;dialog.setAttribute('aria-labelledby',heading.id);dialog.setAttribute('aria-describedby',description.id);form.append(heading,description);for(const field of fields){const wrapper=document.createElement('div'),label=document.createElement('label'),input=document.createElement('input');wrapper.className='app-dialog-field';label.textContent=field.label;input.name=field.name;input.type=field.type||'text';input.value=field.value??'';input.placeholder=field.placeholder||'';input.required=!!field.required;if(field.min!==undefined)input.min=field.min;if(field.max!==undefined)input.max=field.max;if(field.step!==undefined)input.step=field.step;if(field.minLength!==undefined)input.minLength=field.minLength;if(field.autocomplete)input.autocomplete=field.autocomplete;label.htmlFor=`app-dialog-${field.name}`;input.id=label.htmlFor;if(field.type==='checkbox'){wrapper.classList.add('app-dialog-checkbox');label.append(input,document.createTextNode(field.label));wrapper.append(label)}else{wrapper.append(label,input)}if(field.help){const help=document.createElement('small');help.textContent=field.help;wrapper.append(help)}form.append(wrapper);fieldNodes.push(input)}const actions=document.createElement('div'),cancel=document.createElement('bu
